name: skincare_app
description: "SkinCare - User & Doctor Flutter app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Animations
  flutter_animate: ^4.5.2

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Video (patient clips attached to a case, played inline on both sides)
  video_player: ^2.9.2

  # Local storage (onboarding flags; tokens go through flutter_secure_storage)
  shared_preferences: ^2.3.3

  # Backend API + real-time chat/notifications
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.4
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0

  # Real-time video calls (patient <-> doctor)
  agora_rtc_engine: ^6.6.4
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0A7C6E"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    # Bundled locally (not fetched via google_fonts at runtime) so text never
    # depends on a network font download - a slow/blocked fetch on Flutter Web
    # can otherwise paint digits/letters with the wrong glyphs while loading.
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
